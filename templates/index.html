<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Integração ao Flask</title>
    </head>
    <body>
        <h1>Formulário de Cálculo</h1>
<!--Envio de dados via método POST para a mesma rota -->
        <form method="POST" action="/">
            <label for="peso">Peso (kg):</label>
            <input type="number" step="0.1" name="peso" required>

            <label for="altura">Altura (m):</label>
            <input type="number" step="0.1" name="altura" required>

            <button type="submit">Calcular</button>
        </form>
        <hr> 
<!-- Estrutura condicional com a jinja-->
        {% if valor_calculado %} <!--equiparado com o render_template-->
            <h2>Resultado: {{ valor_calculado }}</h2>
        {% endif %}
        <hr>

        <h3>Itens Cadastrados:</h3>
        <ul>
            {% for item in lista_itens %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>
    </body>
</html>
